# Local databases for development:
#   PostgreSQL 16 with the pgvector extension  (relational + vector)
#   MongoDB 7                                   (document store / NoSQL)
#
#   docker compose up -d
#
# Then in .env.local:
#   DATABASE_ADMIN_URL=postgresql://postgres:<POSTGRES_PASSWORD>@localhost:5432/resolvex
#   MONGODB_ADMIN_URI=mongodb://root:<MONGO_ROOT_PASSWORD>@localhost:27017/?authSource=admin
#
# Port already used on your laptop (e.g. you also installed PostgreSQL or MongoDB)?
# Do NOT edit this file - create a file named .env (it is git-ignored) next to it containing
#   DB_PORT=5433
#   MONGO_PORT=27018
# and use those ports in the URLs in .env.local.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resolvex-db
    environment:
      POSTGRES_DB: resolvex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_only}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - resolvex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resolvex"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:7.0
    container_name: resolvex-mongo
    environment:
      # root login, used ONLY by `npm run db:setup` (it creates the app's own limited login)
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-mongo_dev_only}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - resolvex_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 10

volumes:
  resolvex_pgdata:
  resolvex_mongodata:
